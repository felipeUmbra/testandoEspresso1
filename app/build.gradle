plugins {
    alias libs.plugins.android.application
}

android {
    namespace 'br.com.alura.leilao'
    compileSdk 37

    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        applicationId "br.com.alura.leilao"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    testBuildType = 'simulado'

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug{
            buildConfigField "String", "URL_BASE", "\"http://10.0.2.2:8080/\"";
        }
        simulado{
            initWith(buildTypes.debug)
            buildConfigField "String", "URL_BASE", "\"http://10.0.2.2:8081/\"";
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation libs.androidx.appcompat
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.recyclerview
    implementation libs.androidx.test.ext.junit
    implementation libs.androidx.espresso.idling.resource
    implementation libs.material
    
    testImplementation libs.junit
    testImplementation libs.hamcrest.all
    testImplementation libs.mockito.core
    
    androidTestImplementation libs.androidx.runner
    androidTestImplementation libs.androidx.test.ext.junit
    androidTestImplementation libs.androidx.test.rules
    androidTestImplementation libs.androidx.espresso.core
    androidTestImplementation 'net.datafaker:datafaker:2.7.0'
    
    implementation libs.retrofit
    implementation libs.logging.interceptor
    implementation libs.converter.gson
}
